name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        cd backend
        pip install -r requirements.txt pytest
    - name: Run tests
      run: |
        cd backend
        pytest



  deploy:
    needs: test-backend
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_SENDER_EMAIL: ${{ secrets.BREVO_SENDER_EMAIL }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          INITIAL_ADMIN_USERNAME: ${{ secrets.INITIAL_ADMIN_USERNAME }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: POSTGRES_USER,POSTGRES_PASSWORD,POSTGRES_DB,SECRET_KEY,GOOGLE_CLIENT_ID,VAPID_PUBLIC_KEY,VAPID_PRIVATE_KEY,BREVO_API_KEY,BREVO_SENDER_EMAIL,SENTRY_DSN,FRONTEND_URL,GEMINI_API_KEY,INITIAL_ADMIN_USERNAME
          script: |
            cd gym-progress-analytics
            echo "POSTGRES_USER=$POSTGRES_USER" > .env
            echo "POSTGRES_PASSWORD=$POSTGRES_PASSWORD" >> .env
            echo "POSTGRES_DB=$POSTGRES_DB" >> .env
            echo "SECRET_KEY=$SECRET_KEY" >> .env
            echo "GOOGLE_CLIENT_ID=$GOOGLE_CLIENT_ID" >> .env
            echo "VAPID_PUBLIC_KEY=$VAPID_PUBLIC_KEY" >> .env
            echo "VAPID_PRIVATE_KEY=$VAPID_PRIVATE_KEY" >> .env
            echo "BREVO_API_KEY=$BREVO_API_KEY" >> .env
            echo "BREVO_SENDER_EMAIL=$BREVO_SENDER_EMAIL" >> .env
            echo "SENTRY_DSN=$SENTRY_DSN" >> .env
            echo "FRONTEND_URL=$FRONTEND_URL" >> .env
            echo "GEMINI_API_KEY=$GEMINI_API_KEY" >> .env
            echo "INITIAL_ADMIN_USERNAME=$INITIAL_ADMIN_USERNAME" >> .env
            git pull
            docker compose up -d --build
            docker compose exec -T backend alembic upgrade head

